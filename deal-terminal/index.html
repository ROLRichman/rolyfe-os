<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RO'Lyfe Deal Terminal</title>

<link rel="stylesheet" href="../styles.css">

<style>

.container{
max-width:1500px;
margin:auto;
}

.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111827;
padding:22px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
margin-bottom:20px;
}

.card h2{
margin-bottom:18px;
color:#00ff9d;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-size:14px;
opacity:.9;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1f2937;
color:#fff;
font-size:15px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:14px;

background:
linear-gradient(
90deg,
#00e5ff,
#00ff9d
);

color:#000;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.results{
margin-top:20px;
padding:18px;
background:#0f172a;
border-radius:16px;
line-height:1.8;
}

.result-line{
padding:10px;
border-bottom:
1px solid rgba(255,255,255,.08);
}

.green{
color:#00ff9d;
}

.yellow{
color:#ffe066;
}

.red{
color:#ff5d73;
}

.blue{
color:#00e5ff;
}

.badge{
display:inline-block;
padding:12px 16px;
border-radius:14px;
margin-top:12px;
font-weight:bold;
}

.good{
background:#123524;
color:#00ff9d;
}

.mid{
background:#3a2f10;
color:#ffe066;
}

.bad{
background:#3b1218;
color:#ff5d73;
}

.quick-links{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:18px;
}

.quick-links a{
text-decoration:none;
padding:14px;
border-radius:14px;
background:#1f2937;
color:#fff;
text-align:center;
font-weight:bold;
}

.info{
cursor:pointer;
color:#00e5ff;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
padding:20px;
}

.modal-box{
max-width:650px;
margin:80px auto;
background:#111827;
border-radius:20px;
padding:24px;
border:1px solid rgba(0,255,136,.25);
}

.close{
float:right;
font-size:24px;
cursor:pointer;
color:#ff5d73;
}

@media(max-width:980px){

.split{
grid-template-columns:1fr;
}

}

</style>

</head>
