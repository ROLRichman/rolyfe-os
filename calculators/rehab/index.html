<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO'Lyfe Rehab Budget Calculator</title>
<link rel="stylesheet" href="../../styles.css">

<style>
.table-wrap{
overflow-x:auto;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
}

table{
width:100%;
border-collapse:collapse;
min-width:900px;
background:#0f1a16;
}

th{
background:#00ff88;
color:#000;
padding:12px;
text-align:left;
font-size:14px;
}

td{
border-bottom:1px solid rgba(255,255,255,.08);
padding:8px;
vertical-align:top;
}

td:nth-child(1){
width:90px;
font-weight:bold;
color:#ffd966;
}

td:nth-child(2){
width:260px;
}

td:nth-child(3){
width:180px;
}

td:nth-child(4){
width:360px;
}

input,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#1b2a25;
color:white;
font-size:15px;
}

textarea{
min-height:60px;
resize:vertical;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin-top:20px;
}

.result{
background:#06110d;
border:1px solid rgba(0,255,136,.25);
border-radius:16px;
padding:16px;
text-align:center;
}

.result h3{
color:#00ff88;
font-size:15px;
margin-bottom:8px;
}

.result p{
font-size:24px;
font-weight:bold;
}
</style>
</head>
