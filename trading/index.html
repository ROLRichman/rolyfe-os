<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RO'Lyfe Trading Terminal</title>

<link rel="stylesheet" href="../styles.css">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

.container{
max-width:1450px;
margin:auto;
}

.trade-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
margin-bottom:20px;
}

.card h2{
margin-bottom:18px;
color:#00ff9d;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-size:14px;
opacity:.9;
}

input,
select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
background:#1f2937;
color:#fff;
font-size:15px;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:14px;

background:
linear-gradient(
90deg,
#00e5ff,
#00ff9d
);

color:#000;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.results{
margin-top:20px;
padding:18px;
background:#0f172a;
border-radius:16px;
line-height:1.8;
}

.result-line{
padding:10px;
border-bottom:
1px solid rgba(255,255,255,.08);
}

.green{
color:#00ff9d;
}

.yellow{
color:#ffe066;
}

.red{
color:#ff5d73;
}

.blue{
color:#00e5ff;
}

#tvchart{
height:600px;
border-radius:20px;
overflow:hidden;
}

.preset-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:12px;
}

.preset-buttons button{
width:auto;
padding:10px 14px;
margin:0;
font-size:13px;
}

@media(max-width:980px){

.trade-grid{
grid-template-columns:1fr;
}

}

</style>

</head>
